name: Release Plugin Zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build plugin package
        run: |
          set -e
          mkdir -p build/ats-ai-live-chat-wordpress
          cp -R admin assets includes public build/ats-ai-live-chat-wordpress/
          cp ats-ai-live-chat.php README.md build/ats-ai-live-chat-wordpress/
          cd build
          zip -r ats-ai-live-chat-wordpress.zip ats-ai-live-chat-wordpress

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -E "Version:" ats-ai-live-chat.php | head -n1 | awk '{print $2}')
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: build/ats-ai-live-chat-wordpress.zip
          generate_release_notes: true
